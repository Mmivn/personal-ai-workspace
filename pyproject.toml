[project]
name = "personal-ai-workspace"
version = "0.1.0"
description = "Personal hub of AI-assisted agents, tools, and automations."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pyright>=1.1",
]

# This project is a collection of standalone tools run via `python -m`, not a
# distributable package — tell uv not to try to build/install it as one.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["tools", "shared", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
